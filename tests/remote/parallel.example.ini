# Copy to parallel.ini. Three aliases of the same host run in parallel worker threads.
[par]
p1 ansible_host=192.0.2.10
p2 ansible_host=192.0.2.10
p3 ansible_host=192.0.2.10
[par:vars]
ansible_user=youruser
ansible_ssh_private_key_file=~/.ssh/id_ed25519
